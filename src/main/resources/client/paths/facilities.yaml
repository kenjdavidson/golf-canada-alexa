/api/facilities/search:
  get:
    summary: Search for golf facilities
    tags: ["Facilities"]
    operationId: searchFacilities
    parameters:
      - name: $top
        in: query
        required: false
        description: Maximum number of results to return
        schema:
          type: integer
          default: 10
      - name: nationalAssociation
        in: query
        required: false
        description: National association to filter by (e.g., RCGA)
        schema:
          type: string
      - name: text
        in: query
        required: false
        description: Search text to match against facility names
        schema:
          type: string
    responses:
      200:
        description: Facility search results retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../models/FacilitySearchResponse.yaml'
      400:
        description: Invalid Request
