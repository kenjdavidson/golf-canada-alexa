type: object
properties:
  id:
    type: integer
    format: int64
    nullable: true
  individualId:
    type: identifier
  date:
    type: string
    pattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'
  courseId:
    type: integer
    format: int64
  teeId:
    type: integer
    format: int64
  holesPlayed:
    type: string
  formatPlayed:
    type: string
  esc:
    type: integer
    nullable: true
  holeScores:
    type: array
    items:
      $ref: ./HoleScore.yaml
  isHoleByHole:
    type: boolean
  isHoleByHoleRequired:
    type: boolean
  isTrackingStats:
    type: boolean
  isTournament:
    type: boolean
  isPenalty:
    type: boolean
  attestor:
    type: string
    nullable: true
  isPlayedAlone:
    type: boolean
  facilityId:
    type: integer
    format: int64
  differential:
    type: number
    format: double
  adjustments:
    type: number
    format: double
    nullable: true
  adjustedDifferential:
    type: number
    format: double
  newAdjustment:
    type: number
    format: double
    nullable: true
  isManualEntry:
    type: boolean
  courseName:
    type: string
    nullable: true
  teeName:
    type: string
    nullable: true
  rating:
    type: number
    format: double
    nullable: true
  slope:
    type: integer
    nullable: true
