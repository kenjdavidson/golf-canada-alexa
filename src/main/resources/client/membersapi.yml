openapi: 3.0.3
info:
  title: Golf Canada Members API
  version: 1.0.0
paths:
  /api/members/{userId}/getSnapshot:
    get:
      summary: Retrieve member snapshot
      tags: ["Members"]
      operationId: getSnapshot
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
      responses:
        200:
          description: Member snapshot retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSnapshot"
        401:
          description: Not Authorized
        404:
          description: Member Not Found
          
  /api/members/{userId}/getFriends:
    get:
      summary: Retrieve member friends list
      tags: ["Members"]
      operationId: getFriends
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Friends list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"
        401:
          description: Not Authorized
        404:
          description: Member Not Found

  /api/members/{userId}/getHandicapHistory:
    get:
      summary: Retrieve member handicap history
      tags: ["Members"]
      operationId: getHandicapHistory
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
        - name: offsetInDays
          in: query
          required: false
          description: Offset in days from current date (use negative values for past dates)
          schema:
            type: integer
            default: -365
      responses:
        200:
          description: Handicap history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HandicapHistoryEntry"
        401:
          description: Not Authorized
        404:
          description: Member Not Found

  /api/members/{userId}/getCourseList:
    get:
      summary: Retrieve member course list (favorite courses)
      tags: ["Members"]
      operationId: getCourseList
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
      responses:
        200:
          description: Course list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        401:
          description: Not Authorized
        404:
          description: Member Not Found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MemberSnapshot:
      type: object
      properties:
        club:
          type: string
        membershipType:
          type: string
        expirationDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        homeCourse:
          type: string
        defaultTee:
          type: string
        courseHandicap:
          type: string
        winterHandicap:
          type: string
        winterCourseHandicap:
          type: string
        isWinterHandicapDisplayed:
          type: boolean
        scores:
          type: array
          items:
            $ref: "#/components/schemas/Score"
        clubManagementGroup:
          type: string
        ytdScoreCount:
          type: integer
        ytdScoreAverage:
          type: number
          format: double
        ytdYear:
          type: integer
        transferClubName:
          type: string
        transferRequestDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        lastCardRequestedOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?"
        expectedDeliveryOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        isCardsSentToClub:
          type: boolean
        lowHandicap:
          type: string
        lowHandicapOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        adjustedLowHandicap:
          type: string
        displayLowHandicap:
          type: string
        adjustedLowHandicapStartOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        adjustedLowHandicapEndOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        lowHandicapAdjustedOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        isLowIndexAdjusted:
          type: boolean
        subscriptionRenewsOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"

    Score:
      type: object
      properties:
        course:
          type: string
        datePlayed:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        holesPlayed:
          type: integer
        score:
          type: integer
        isUsedInCalc:
          type: boolean
          
    Friend:
      type: object
      properties:
        individualId:
          type: identifier
        name:
          type: string
        club:
          type: string
        region:
          type: string
        handicap:
          type: string
        cardId:
          type: string
        gender:
          type: string
        level:
          type: string
        expiresOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?"

    Course:
      type: object
      properties:
        id:
          type: integer
          format: int64
        individualId:
          type: identifier
        name:
          type: string
        city:
          type: string
        region:
          type: string
          
    HandicapHistoryEntry:
      type: object
      properties:
        date:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        handicap:
          type: number
          format: double
        lowHandicap:
          type: number
          format: double
