openapi: 3.0.3
info:
  title: Golf Canada Client
  description: |
    Unofficial Golf Canada HTTP Client.
  version: 1.0.0
  contact:
    name: Ken Davidson
    url: https://github.com/kenjdavidson/golf-canada-alexa
    email: ken.j.davidson@live.ca
servers:
  - url: 'https://scg.golfcanada.ca'
paths:
  /connect/token:
    post:
      summary: Retrieve authentication token
      tags: ["Auth"]
      operationId: getAuthToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        200:
          description: Login Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        401:
          description: Not Authorized
        400:
          description: Invalid Request

  /api/members/{userId}/getSnapshot:
    get:
      summary: Retrieve member snapshot
      tags: ["Members"]
      operationId: getSnapshot
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
      responses:
        200:
          description: Member snapshot retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSnapshot"
        401:
          description: Not Authorized
        404:
          description: Member Not Found
          
  /api/members/{userId}/getFriends:
    get:
      summary: Retrieve member friends list
      tags: ["Members"]
      operationId: getFriends
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Friends list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"
        401:
          description: Not Authorized
        404:
          description: Member Not Found

  /api/members/{userId}/getHandicapHistory:
    get:
      summary: Retrieve member handicap history
      tags: ["Members"]
      operationId: getHandicapHistory
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
        - name: offsetInDays
          in: query
          required: false
          description: Offset in days from current date (use negative values for past dates)
          schema:
            type: integer
            default: -365
      responses:
        200:
          description: Handicap history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HandicapHistoryEntry"
        401:
          description: Not Authorized
        404:
          description: Member Not Found

  /api/scores/getHandicapCalculation:
    get:
      summary: Retrieve handicap calculation for an individual
      tags: ["Scores"]
      operationId: getHandicapCalculation
      security:
        - bearerAuth: []
      parameters:
        - name: individualId
          in: query
          required: true
          description: The unique identifier of the individual
          schema:
            type: identifier
      responses:
        200:
          description: Handicap calculation retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandicapCalculation"
        401:
          description: Not Authorized
        404:
          description: Handicap calculation not found

  /api/gameTracker/getSummary:
    get:
      summary: Retrieve game tracker summary for an individual
      tags: ["GameTracker"]
      operationId: getGameTrackerSummary
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: query
          required: true
          description: The unique identifier of the course
          schema:
            type: integer
            format: int64
        - name: individualId
          in: query
          required: true
          description: The unique identifier of the individual
          schema:
            type: identifier
        - name: range
          in: query
          required: true
          description: The range of data to retrieve (e.g., YTD, Last20, or a specific year like 2025)
          schema:
            type: string
      responses:
        200:
          description: Game tracker summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTrackerSummary"
        401:
          description: Not Authorized
        404:
          description: Game tracker summary not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthRequest:
      type: object
      required:
        - grant_type
        - scope
      properties:
        grant_type:
          type: string
          enum: [password, refresh_token]
          x-enum-varnames: [PASSWORD, REFRESH_TOKEN]
        scope:
          type: string
        username:
          type: string
        password:
          type: string
        refresh_token:
          type: string

    AuthToken:
      type: object
      properties:
          access_token:
            type: string
          refresh_token:
            type: string
          id_token:
            type: string
          expires_in:
            type: integer
          token_type:
            type: string
          user:
            $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        allowScorePosting:
          type: boolean
        authUserId:
          type: identifier
        clubManagementGroupId:
          type: integer
        email:
          type: string
        expirationDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        firstName:
          type: string
        fullName:
          type: string
        golfCanadaCardId:
          type: string
        handicap:
          type: string
        id:
          type: identifier
        lastName:
          type: string
        membershipLevel:
          type: string
        networkId:
          type: string
        termsAndConditionsDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        username:
          type: string
        scoreDefaults:
          $ref: "#/components/schemas/ScoreDefaults"

    ScoreDefaults:
      type: object
      properties:
        facilityName:
          type: string
        facilityId:
          type: integer
        courseId:
          type: integer
        teeId:
          type: integer
        nationalAssociation:
          type: string
        postHoleByHole:
          type: boolean

    MemberSnapshot:
      type: object
      properties:
        club:
          type: string
        membershipType:
          type: string
        expirationDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        homeCourse:
          type: string
        defaultTee:
          type: string
        courseHandicap:
          type: string
        winterHandicap:
          type: string
        winterCourseHandicap:
          type: string
        isWinterHandicapDisplayed:
          type: boolean
        scores:
          type: array
          items:
            $ref: "#/components/schemas/Score"
        clubManagementGroup:
          type: string
        ytdScoreCount:
          type: integer
        ytdScoreAverage:
          type: number
          format: double
        ytdYear:
          type: integer
        transferClubName:
          type: string
        transferRequestDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        lastCardRequestedOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?"
        expectedDeliveryOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        isCardsSentToClub:
          type: boolean
        lowHandicap:
          type: string
        lowHandicapOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        adjustedLowHandicap:
          type: string
        displayLowHandicap:
          type: string
        adjustedLowHandicapStartOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        adjustedLowHandicapEndOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        lowHandicapAdjustedOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        isLowIndexAdjusted:
          type: boolean
        subscriptionRenewsOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"

    Score:
      type: object
      properties:
        course:
          type: string
        datePlayed:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        holesPlayed:
          type: integer
        score:
          type: integer
        isUsedInCalc:
          type: boolean

    HandicapCalculation:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        club:
          type: string
        handicap:
          type: string
        handicapDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        scores:
          type: array
          items:
            $ref: "#/components/schemas/HandicapScore"
        clubManagementGroup:
          type: string
        scoreCount:
          type: integer
        numCalcScores:
          type: integer
        handicapScores:
          type: array
          items:
            $ref: "#/components/schemas/HandicapScore"
        adjustedScores:
          type: array
          items:
            $ref: "#/components/schemas/HandicapScore"
        esrTriggerScores:
          type: array
          items:
            $ref: "#/components/schemas/HandicapScore"
        exceptionalScores:
          type: array
          items:
            $ref: "#/components/schemas/HandicapScore"
        pccScores:
          type: array
          items:
            $ref: "#/components/schemas/HandicapScore"
        committeeScores:
          type: array
          items:
            $ref: "#/components/schemas/HandicapScore"
        diffSum:
          type: number
          format: double
        avgDiff:
          type: number
          format: double
        lowValue:
          type: number
          format: double
        isLowValueAdjusted:
          type: boolean
        lowIndexAdjustedOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        calcValue:
          type: number
          format: double
        adjustedValue:
          type: number
          format: double
        lowValueDifference:
          type: number
          format: double
        softCap:
          type: number
          format: double
        hardCap:
          type: number
          format: double
        lowScoreCountAdjustment:
          type: integer
        adjustedAvgDiff:
          type: number
          format: double

    HandicapScore:
      type: object
      properties:
        date:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        value:
          type: integer
        course:
          type: string
        rating:
          type: number
          format: double
        slope:
          type: integer
        differential:
          type: number
          format: double
        adjustedDifferential:
          type: number
          format: double
        adjustment:
          type: number
          format: double
        type:
          type: string
        isUsedInCalc:
          type: boolean
        esrAdjustment:
          type: number
          format: double
        pccAdjustment:
          type: number
          format: double
        hcAdjustment:
          type: number
          format: double
        esrMulti:
          type: number
          format: double
        pccMulti:
          type: number
          format: double
        hcMulti:
          type: number
          format: double
        esrIdentifier:
          type: string
        scaledHolesPlayed:
          type: integer
        scaleTypeId:
          type: string
          
    Friend:
      type: object
      properties:
        individualId:
          type: identifier
        name:
          type: string
        club:
          type: string
        region:
          type: string
        handicap:
          type: string
        cardId:
          type: string
        gender:
          type: string
        level:
          type: string
        expiresOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?"
          
    HandicapHistoryEntry:
      type: object
      properties:
        date:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        handicap:
          type: number
          format: double
        lowHandicap:
          type: number
          format: double

        
    GameTrackerSummary:
      type: object
      properties:
        albatross:
          type: integer
        albatrossPercent:
          type: number
          format: double
        eagles:
          type: integer
        eaglePercent:
          type: number
          format: double
        birdies:
          type: integer
        birdiePercent:
          type: number
          format: double
        pars:
          type: integer
        parPercent:
          type: number
          format: double
        bogeys:
          type: integer
        bogeyPercent:
          type: number
          format: double
        doubles:
          type: integer
        doublePercent:
          type: number
          format: double
        others:
          type: integer
        otherPercent:
          type: number
          format: double
        totalPutts:
          type: integer
        puttsPerRound:
          type: number
          format: double
        puttsPerHole:
          type: number
          format: double
        proximity:
          type: number
          format: double
          nullable: true
        girHit:
          type: integer
        girOpportunities:
          type: number
          format: double
        girPercent:
          type: number
          format: double
        drivingAverage:
          type: number
          format: double
          nullable: true
        firHit:
          type: integer
        firMissedLeft:
          type: integer
        firMissedRight:
          type: integer
        firMissedLong:
          type: integer
        firMissedShort:
          type: integer
        firMissedOther:
          type: integer
        firOpportunities:
          type: integer
        firPercent:
          type: number
          format: double
        scrambling:
          type: number
          format: double
        upDown:
          type: number
          format: double
        sandSave:
          type: number
          format: double
        bounceBack:
          type: number
          format: double
        par3:
          type: number
          format: double
        par4:
          type: number
          format: double
        par5:
          type: number
          format: double
        scores:
          type: array
          items:
            $ref: "#/components/schemas/SummaryScore"
        holeStatistics:
          type: array
          items:
            $ref: "#/components/schemas/HoleStatistic"

    SummaryScore:
        course:
          type: string
        gross:
          type: integer
        differential:
          type: number
          format: double
        esc:
          type: integer
        slope:
          type: integer
        rating:
          type: number
          format: double

    HoleStatistic:
      type: object
      properties:
        number:
          type: integer
        par:
          type: integer
        averageScore:
          type: number
          format: double
        averagePutts:
          type: number
          format: double
        totalAlbatross:
          type: integer
        totalEagles:
          type: integer
        totalBirdies:
          type: integer
        totalPars:
          type: integer
        totalBogeys:
          type: integer
        totalDoubles:
          type: integer
        totalDoublesPlus:
          type: integer
        totalPenalties:
          type: integer