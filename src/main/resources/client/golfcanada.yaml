openapi: 3.0.3
info:
  title: Golf Canada Client
  description: |
    Unofficial Golf Canada HTTP Client.
  version: 1.0.0
  contact:
    name: Ken Davidson
    url: https://github.com/kenjdavidson/golf-canada-alexa
    email: ken.j.davidson@live.ca
servers:
  - url: 'https://scg.golfcanada.ca'
paths:
  /connect/token:
    post:
      summary: Retrieve authentication token
      tags: ["Auth"]
      operationId: getAuthToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        200:
          description: Login Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        401:
          description: Not Authorized
        400:
          description: Invalid Request

  /api/members/{userId}/getSnapshot:
    get:
      summary: Retrieve member snapshot
      tags: ["Members"]
      operationId: getSnapshot
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
      responses:
        200:
          description: Member snapshot retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSnapshot"
        401:
          description: Not Authorized
        404:
          description: Member Not Found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthRequest:
      type: object
      required:
        - grant_type
        - scope
      properties:
        grant_type:
          type: string
          enum: [password, refresh_token]
          x-enum-varnames: [PASSWORD, REFRESH_TOKEN]
        scope:
          type: string
        username:
          type: string
        password:
          type: string
        refresh_token:
          type: string

    AuthToken:
      type: object
      properties:
          access_token:
            type: string
          refresh_token:
            type: string
          id_token:
            type: string
          expires_in:
            type: integer
          token_type:
            type: string
          user:
            $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        allowScorePosting:
          type: boolean
        authUserId:
          type: identifier
        clubManagementGroupId:
          type: integer
        email:
          type: string
        expirationDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        firstName:
          type: string
        fullName:
          type: string
        golfCanadaCardId:
          type: string
        handicap:
          type: string
        id:
          type: identifier
        lastName:
          type: string
        membershipLevel:
          type: string
        networkId:
          type: string
        termsAndConditionsDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        username:
          type: string
        scoreDefaults:
          $ref: "#/components/schemas/ScoreDefaults"

    ScoreDefaults:
      type: object
      properties:
        facilityName:
          type: string
        facilityId:
          type: integer
        courseId:
          type: integer
        teeId:
          type: integer
        nationalAssociation:
          type: string
        postHoleByHole:
          type: boolean

    MemberSnapshot:
      type: object
      properties:
        club:
          type: string
        membershipType:
          type: string
        expirationDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        homeCourse:
          type: string
        defaultTee:
          type: string
        courseHandicap:
          type: string
        winterHandicap:
          type: string
        winterCourseHandicap:
          type: string
        isWinterHandicapDisplayed:
          type: boolean
        scores:
          type: array
          items:
            $ref: "#/components/schemas/Score"
        clubManagementGroup:
          type: string
        ytdScoreCount:
          type: integer
        ytdScoreAverage:
          type: number
          format: double
        ytdYear:
          type: integer
        transferClubName:
          type: string
        transferRequestDate:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        lastCardRequestedOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?"
        expectedDeliveryOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        isCardsSentToClub:
          type: boolean
        lowHandicap:
          type: string
        lowHandicapOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        adjustedLowHandicap:
          type: string
        displayLowHandicap:
          type: string
        adjustedLowHandicapStartOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        adjustedLowHandicapEndOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        lowHandicapAdjustedOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        isLowIndexAdjusted:
          type: boolean
        subscriptionRenewsOn:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"

    Score:
      type: object
      properties:
        course:
          type: string
        datePlayed:
          type: string
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}"
        holesPlayed:
          type: integer
        score:
          type: integer
        isUsedInCalc:
          type: boolean
