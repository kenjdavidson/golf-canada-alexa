openapi: 3.0.3
info:
  title: Golf Canada Client
  description: |
    Unofficial Golf Canada HTTP Client.
  version: 1.0.0
  contact:
    name: Ken Davidson
    url: https://github.com/kenjdavidson/golf-canada-alexa
    email: ken.j.davidson@live.ca
servers:
  - url: 'https://scg.golfcanada.ca'
paths:
  /connect/token:
    post:
      summary: Retrieve authentication token
      tags: ["Auth"]
      operationId: getAuthToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: './authapi.yml#/components/schemas/AuthRequest'
      responses:
        200:
          description: Login Successful
          content:
            application/json:
              schema:
                $ref: './authapi.yml#/components/schemas/AuthToken'
        401:
          description: Not Authorized
        400:
          description: Invalid Request
  
  /api/members/{userId}/getSnapshot:
    get:
      summary: Retrieve member snapshot
      tags: ["Members"]
      operationId: getSnapshot
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
      responses:
        200:
          description: Member snapshot retrieved successfully
          content:
            application/json:
              schema:
                $ref: './membersapi.yml#/components/schemas/MemberSnapshot'
        401:
          description: Not Authorized
        404:
          description: Member Not Found
  
  /api/members/{userId}/getFriends:
    get:
      summary: Retrieve member friends list
      tags: ["Members"]
      operationId: getFriends
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Friends list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './membersapi.yml#/components/schemas/Friend'
        401:
          description: Not Authorized
        404:
          description: Member Not Found
  
  /api/members/{userId}/getHandicapHistory:
    get:
      summary: Retrieve member handicap history
      tags: ["Members"]
      operationId: getHandicapHistory
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
        - name: offsetInDays
          in: query
          required: false
          description: Offset in days from current date (use negative values for past dates)
          schema:
            type: integer
            default: -365
      responses:
        200:
          description: Handicap history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './membersapi.yml#/components/schemas/HandicapHistoryEntry'
        401:
          description: Not Authorized
        404:
          description: Member Not Found
  
  /api/members/{userId}/getCourseList:
    get:
      summary: Retrieve member course list (favorite courses)
      tags: ["Members"]
      operationId: getCourseList
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
      responses:
        200:
          description: Course list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './membersapi.yml#/components/schemas/Course'
        401:
          description: Not Authorized
        404:
          description: Member Not Found
  
  /api/scores/getHandicapCalculation:
    get:
      summary: Retrieve handicap calculation for an individual
      tags: ["Scores"]
      operationId: getHandicapCalculation
      security:
        - bearerAuth: []
      parameters:
        - name: individualId
          in: query
          required: true
          description: The unique identifier of the individual
          schema:
            type: identifier
      responses:
        200:
          description: Handicap calculation retrieved successfully
          content:
            application/json:
              schema:
                $ref: './scoresapi.yml#/components/schemas/HandicapCalculation'
        401:
          description: Not Authorized
        404:
          description: Handicap calculation not found
  
  /api/scores/getScoreData:
    get:
      summary: Retrieve score data for an individual
      tags: ["Scores"]
      operationId: getScoreData
      security:
        - bearerAuth: []
      parameters:
        - name: individualId
          in: query
          required: true
          description: The unique identifier of the individual
          schema:
            type: identifier
      responses:
        200:
          description: Score data retrieved successfully
          content:
            application/json:
              schema:
                $ref: './scoresapi.yml#/components/schemas/ScoreData'
        401:
          description: Not Authorized
        404:
          description: Score data not found
  
  /api/gameTracker/getSummary:
    get:
      summary: Retrieve game tracker summary for an individual
      tags: ["GameTracker"]
      operationId: getGameTrackerSummary
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: query
          required: true
          description: The unique identifier of the course
          schema:
            type: integer
            format: int64
        - name: individualId
          in: query
          required: true
          description: The unique identifier of the individual
          schema:
            type: identifier
        - name: range
          in: query
          required: true
          description: The range of data to retrieve (e.g., YTD, Last20, or a specific year like 2025)
          schema:
            type: string
      responses:
        200:
          description: Game tracker summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: './gametrackerapi.yml#/components/schemas/GameTrackerSummary'
        401:
          description: Not Authorized
        404:
          description: Game tracker summary not found
  
  /api/facilities/search:
    get:
      summary: Search for golf facilities
      tags: ["Facilities"]
      operationId: searchFacilities
      parameters:
        - name: $top
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            default: 10
        - name: nationalAssociation
          in: query
          required: false
          description: National association to filter by (e.g., RCGA)
          schema:
            type: string
        - name: text
          in: query
          required: false
          description: Search text to match against facility names
          schema:
            type: string
      responses:
        200:
          description: Facility search results retrieved successfully
          content:
            application/json:
              schema:
                $ref: './facilitiesapi.yml#/components/schemas/FacilitySearchResponse'
        400:
          description: Invalid Request

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Auth API schemas
    AuthRequest:
      $ref: './authapi.yml#/components/schemas/AuthRequest'
    AuthToken:
      $ref: './authapi.yml#/components/schemas/AuthToken'
    User:
      $ref: './authapi.yml#/components/schemas/User'
    ScoreDefaults:
      $ref: './authapi.yml#/components/schemas/ScoreDefaults'
    
    # Members API schemas
    MemberSnapshot:
      $ref: './membersapi.yml#/components/schemas/MemberSnapshot'
    Score:
      $ref: './membersapi.yml#/components/schemas/Score'
    Friend:
      $ref: './membersapi.yml#/components/schemas/Friend'
    Course:
      $ref: './membersapi.yml#/components/schemas/Course'
    HandicapHistoryEntry:
      $ref: './membersapi.yml#/components/schemas/HandicapHistoryEntry'
    
    # Scores API schemas
    HandicapCalculation:
      $ref: './scoresapi.yml#/components/schemas/HandicapCalculation'
    HandicapScore:
      $ref: './scoresapi.yml#/components/schemas/HandicapScore'
    ScoreData:
      $ref: './scoresapi.yml#/components/schemas/ScoreData'
    ScoreDetail:
      $ref: './scoresapi.yml#/components/schemas/ScoreDetail'
    HoleScore:
      $ref: './scoresapi.yml#/components/schemas/HoleScore'
    Facility:
      $ref: './scoresapi.yml#/components/schemas/Facility'
    CourseDetail:
      $ref: './scoresapi.yml#/components/schemas/CourseDetail'
    Tee:
      $ref: './scoresapi.yml#/components/schemas/Tee'
    Hole:
      $ref: './scoresapi.yml#/components/schemas/Hole'
    
    # GameTracker API schemas
    GameTrackerSummary:
      $ref: './gametrackerapi.yml#/components/schemas/GameTrackerSummary'
    SummaryScore:
      $ref: './gametrackerapi.yml#/components/schemas/SummaryScore'
    HoleStatistic:
      $ref: './gametrackerapi.yml#/components/schemas/HoleStatistic'
    
    # Facilities API schemas
    FacilitySearchResponse:
      $ref: './facilitiesapi.yml#/components/schemas/FacilitySearchResponse'
    FacilitySearchResult:
      $ref: './facilitiesapi.yml#/components/schemas/FacilitySearchResult'
