openapi: 3.0.3
info:
  title: Golf Canada Client
  description: |
    Unofficial Golf Canada HTTP Client.
  version: 1.0.0
  contact:
    name: Ken Davidson
    url: https://github.com/kenjdavidson/golf-canada-alexa
    email: ken.j.davidson@live.ca
servers:
  - url: 'https://scg.golfcanada.ca'
paths:
  /connect/token:
    post:
      summary: Retrieve authentication token
      tags: ["Auth"]
      operationId: getAuthToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: './models/AuthRequest.yaml'
      responses:
        200:
          description: Login Successful
          content:
            application/json:
              schema:
                $ref: './models/AuthToken.yaml'
        401:
          description: Not Authorized
        400:
          description: Invalid Request

  /api/members/{userId}/getSnapshot:
    get:
      summary: Retrieve member snapshot
      tags: ["Members"]
      operationId: getSnapshot
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
      responses:
        200:
          description: Member snapshot retrieved successfully
          content:
            application/json:
              schema:
                $ref: './models/MemberSnapshot.yaml'
        401:
          description: Not Authorized
        404:
          description: Member Not Found
          
  /api/members/{userId}/getFriends:
    get:
      summary: Retrieve member friends list
      tags: ["Members"]
      operationId: getFriends
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Friends list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './models/Friend.yaml'
        401:
          description: Not Authorized
        404:
          description: Member Not Found

  /api/members/{userId}/getHandicapHistory:
    get:
      summary: Retrieve member handicap history
      tags: ["Members"]
      operationId: getHandicapHistory
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
        - name: offsetInDays
          in: query
          required: false
          description: Offset in days from current date (use negative values for past dates)
          schema:
            type: integer
            default: -365
      responses:
        200:
          description: Handicap history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './models/HandicapHistoryEntry.yaml'
        401:
          description: Not Authorized
        404:
          description: Member Not Found

  /api/members/{userId}/getCourseList:
    get:
      summary: Retrieve member course list (favorite courses)
      tags: ["Members"]
      operationId: getCourseList
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the member
          schema:
            type: identifier
      responses:
        200:
          description: Course list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './models/Course.yaml'
        401:
          description: Not Authorized
        404:
          description: Member Not Found

  /api/scores/getHandicapCalculation:
    get:
      summary: Retrieve handicap calculation for an individual
      tags: ["Scores"]
      operationId: getHandicapCalculation
      security:
        - bearerAuth: []
      parameters:
        - name: individualId
          in: query
          required: true
          description: The unique identifier of the individual
          schema:
            type: identifier
      responses:
        200:
          description: Handicap calculation retrieved successfully
          content:
            application/json:
              schema:
                $ref: './models/HandicapCalculation.yaml'
        401:
          description: Not Authorized
        404:
          description: Handicap calculation not found

  /api/gameTracker/getSummary:
    get:
      summary: Retrieve game tracker summary for an individual
      tags: ["GameTracker"]
      operationId: getGameTrackerSummary
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: query
          required: true
          description: The unique identifier of the course
          schema:
            type: integer
            format: int64
        - name: individualId
          in: query
          required: true
          description: The unique identifier of the individual
          schema:
            type: identifier
        - name: range
          in: query
          required: true
          description: The range of data to retrieve (e.g., YTD, Last20, or a specific year like 2025)
          schema:
            type: string
      responses:
        200:
          description: Game tracker summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: './models/GameTrackerSummary.yaml'
        401:
          description: Not Authorized
        404:
          description: Game tracker summary not found

  /api/scores/getScoreData:
    get:
      summary: Retrieve score data for an individual
      tags: ["Scores"]
      operationId: getScoreData
      security:
        - bearerAuth: []
      parameters:
        - name: individualId
          in: query
          required: true
          description: The unique identifier of the individual
          schema:
            type: identifier
      responses:
        200:
          description: Score data retrieved successfully
          content:
            application/json:
              schema:
                $ref: './models/ScoreData.yaml'
        401:
          description: Not Authorized
        404:
          description: Score data not found

  /api/facilities/search:
    get:
      summary: Search for golf facilities
      tags: ["Facilities"]
      operationId: searchFacilities
      parameters:
        - name: $top
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            default: 10
        - name: nationalAssociation
          in: query
          required: false
          description: National association to filter by (e.g., RCGA)
          schema:
            type: string
        - name: text
          in: query
          required: false
          description: Search text to match against facility names
          schema:
            type: string
      responses:
        200:
          description: Facility search results retrieved successfully
          content:
            application/json:
              schema:
                $ref: './models/FacilitySearchResponse.yaml'
        400:
          description: Invalid Request

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  # Schema definitions reference external modular files in ./models/ directory.
  # The bundleOpenApiSpec task resolves these references before code generation.
  schemas:
    AuthRequest:
      $ref: './models/AuthRequest.yaml'
    AuthToken:
      $ref: './models/AuthToken.yaml'
    User:
      $ref: './models/User.yaml'
    ScoreDefaults:
      $ref: './models/ScoreDefaults.yaml'
    MemberSnapshot:
      $ref: './models/MemberSnapshot.yaml'
    Score:
      $ref: './models/Score.yaml'
    HandicapCalculation:
      $ref: './models/HandicapCalculation.yaml'
    HandicapScore:
      $ref: './models/HandicapScore.yaml'
    Friend:
      $ref: './models/Friend.yaml'
    Course:
      $ref: './models/Course.yaml'
    HandicapHistoryEntry:
      $ref: './models/HandicapHistoryEntry.yaml'
    GameTrackerSummary:
      $ref: './models/GameTrackerSummary.yaml'
    SummaryScore:
      $ref: './models/SummaryScore.yaml'
    HoleStatistic:
      $ref: './models/HoleStatistic.yaml'
    ScoreData:
      $ref: './models/ScoreData.yaml'
    ScoreDetail:
      $ref: './models/ScoreDetail.yaml'
    HoleScore:
      $ref: './models/HoleScore.yaml'
    Facility:
      $ref: './models/Facility.yaml'
    CourseDetail:
      $ref: './models/CourseDetail.yaml'
    Tee:
      $ref: './models/Tee.yaml'
    Hole:
      $ref: './models/Hole.yaml'
    FacilitySearchResponse:
      $ref: './models/FacilitySearchResponse.yaml'
    FacilitySearchResult:
      $ref: './models/FacilitySearchResult.yaml'