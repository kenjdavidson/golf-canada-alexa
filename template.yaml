AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  golf-canada-alexa

  SAM Template for Golf Canada Alexa Skill with Authentication and Skill Handler functions

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 20
    MemorySize: 512

Parameters:
  ClientId:
    Type: String
    Description: OAuth Client ID for Golf Canada authentication
    NoEcho: true
  
  ClientSecret:
    Type: String
    Description: OAuth Client Secret for Golf Canada authentication
    NoEcho: true
  
  SkillId:
    Type: String
    Description: Alexa Skill ID for the Golf Canada skill

  GolfCanadaUsername:
    Type: String
    Description: >
      Golf Canada username for single-user static authentication mode.
      When set together with GolfCanadaPassword, the skill authenticates directly
      using these credentials instead of requiring Alexa Account Linking.
      Leave empty to use the standard OAuth Account Linking flow.
    Default: ''
    NoEcho: true

  GolfCanadaPassword:
    Type: String
    Description: >
      Golf Canada password for single-user static authentication mode.
      When set together with GolfCanadaUsername, the skill authenticates directly
      using these credentials instead of requiring Alexa Account Linking.
      Leave empty to use the standard OAuth Account Linking flow.
    Default: ''
    NoEcho: true

  DeployAuthentication:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >
      Set to 'false' to remove the GolfCanadaAuthenticationFunction from the stack.
      Use this when deploying in static single-user mode where the OAuth Lambda is not needed.
      When switching from 'true' to 'false', CloudFormation will cleanly delete the function,
      its Lambda URL, and the SSL certificate layer.

Conditions:
  IncludeAuthentication: !Equals [!Ref DeployAuthentication, 'true']

Resources:
  GolfCanadaAuthenticationFunction:
    Type: AWS::Serverless::Function
    Condition: IncludeAuthentication
    Properties:
      CodeUri: .
      Description: 'Provides OAuth wrapper for Golf Canada authentication'
      MemorySize: 512
      Timeout: 120
      Handler: kjd.golfcanada.auth.AuthenticationHandler::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          CLIENT_ID: !Ref ClientId
          CLIENT_SECRET: !Ref ClientSecret
          JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/opt/cacerts/cacertsclient_keystore_1.jks"
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      Layers:
        - !Ref Layer1
      PackageType: Zip
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource:
                - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kjd_golfcanada_alexa_authentication:*'
      SnapStart:
        ApplyOn: None
      Tags:
        application: golfcanada
        application_type: authentication
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto

  GolfCanadaAlexaSkillFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Description: 'Alexa skill handler for Golf Canada voice interactions'
      MemorySize: 512
      Timeout: 20
      Handler: kjd.golfcanada.alexa.GolfCanadaAlexaSkill::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          SKILL_ID: !Ref SkillId
          CLIENT_ID: !Ref ClientId
          CLIENT_SECRET: !Ref ClientSecret
          GOLF_CANADA_USERNAME: !Ref GolfCanadaUsername
          GOLF_CANADA_PASSWORD: !Ref GolfCanadaPassword
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      PackageType: Zip
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource:
                - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kjd_golfcanada_alexa_skill:*'
      SnapStart:
        ApplyOn: None
      Tags:
        application: golfcanada
        application_type: alexa_skill
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto

  # This resource represents your Layer with name GolfCanadaAuthenticationCertLayer.
  # This provides the /opts/cacerts/cacerts file to replace the Java 21 standard cacerts
  Layer1:
    Type: AWS::Serverless::LayerVersion
    Condition: IncludeAuthentication
    Properties:
      ContentUri: ./GolfCanadaAuthenticationCertLayer
      LayerName: GolfCanadaAuthenticationCertLayer
      CompatibleRuntimes:
        - java21

Outputs:
  GolfCanadaAuthenticationFunctionUrl:
    Condition: IncludeAuthentication
    Description: 'URL for the Golf Canada Authentication Function'
    Value: !GetAtt GolfCanadaAuthenticationFunctionUrl.FunctionUrl
    Export:
      Name: !Sub '${AWS::StackName}-AuthFunctionUrl'
  
  GolfCanadaAlexaSkillFunctionArn:
    Description: 'ARN of the Golf Canada Alexa Skill Function'
    Value: !GetAtt GolfCanadaAlexaSkillFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SkillFunctionArn'
