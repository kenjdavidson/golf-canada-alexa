name: Deploy to AWS Lambda

on:
  push:
    tags:
      - 'v*'           # Triggers on any tag starting with 'v' (e.g., v1.0.0, v1.1.0)
      - 'auth-v*'      # Triggers on tags for authentication function only
      - 'skill-v*'     # Triggers on tags for skill function only

permissions:
  contents: read
  id-token: write    # Required for AWS OIDC authentication

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew packageJar

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Determine deployment type
        id: deployment-type
        run: |
          TAG="${{ github.ref_name }}"
          echo "Triggered by tag: $TAG"
          
          if [[ "$TAG" == auth-v* ]]; then
            echo "Deployment type: Authentication-focused release"
            echo "type=authentication" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == skill-v* ]]; then
            echo "Deployment type: Skill-focused release"
            echo "type=skill" >> $GITHUB_OUTPUT
          else
            echo "Deployment type: Full release"
            echo "type=full" >> $GITHUB_OUTPUT
          fi
          
          echo "Note: SAM will deploy the entire stack (both functions) regardless of tag type"

      - name: SAM Build
        run: sam build

      - name: Deploy to AWS
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ secrets.STACK_NAME }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --region ${{ secrets.AWS_REGION }} \
            --parameter-overrides \
              ClientId="${{ secrets.GOLF_CANADA_CLIENT_ID }}" \
              ClientSecret="${{ secrets.GOLF_CANADA_CLIENT_SECRET }}" \
              SkillId="${{ secrets.ALEXA_SKILL_ID }}"

      - name: Output deployment information
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 Deployment type: ${{ steps.deployment-type.outputs.type }}"
          echo "🏷️  Tag: ${{ github.ref_name }}"
          echo "📚 Stack: ${{ secrets.STACK_NAME }}"
          echo "🌍 Region: ${{ secrets.AWS_REGION }}"
