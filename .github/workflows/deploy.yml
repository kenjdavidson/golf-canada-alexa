name: Deploy to AWS Lambda

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Select which Lambda function(s) to deploy'
        required: true
        type: choice
        options:
          - 'both'
          - 'authentication'
          - 'skill'
        default: 'both'

permissions:
  contents: read
  id-token: write    # Required for AWS OIDC authentication

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Restrict deployments to the original repository only (not forks), and only from either:
    #   - the main branch (for ad-hoc manual deployments), or
    #   - a version tag matching 'v*' (e.g. v1.0.0, for tagged release deployments).
    #
    # GitHub Actions secrets are scoped per-repository, so a fork already uses only its own
    # secrets — the fork check here adds defense-in-depth by preventing the workflow from
    # running at all in forked copies.
    #
    # If you have forked this repository for your own personal use, remove the fork check
    # and update the ref conditions to match your own branching/tagging strategy:
    #   if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    if: |
      github.event.repository.fork == false &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Alexa model deployment prerequisites
        if: inputs.deployment_target != 'authentication'
        env:
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
          ALEXA_SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
        run: |
          if [[ -z "$ASK_REFRESH_TOKEN" || -z "$ASK_VENDOR_ID" || -z "$ALEXA_SKILL_ID" ]]; then
            echo "::error::ASK_REFRESH_TOKEN, ASK_VENDOR_ID and ALEXA_SKILL_ID must be configured for skill deployments."
            exit 1
          fi
          python3 -m json.tool model/model.json > /dev/null

      - name: Set up Node.js
        if: inputs.deployment_target != 'authentication'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ASK CLI
        if: inputs.deployment_target != 'authentication'
        run: npm install --global ask-cli@2.30.7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew packageJar

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Determine deployment type
        id: deployment-type
        run: |
          TARGET="${{ inputs.deployment_target }}"
          echo "Deployment target: $TARGET"

          if [[ "$TARGET" == "authentication" ]]; then
            echo "Deploying: Authentication function only"
            echo "type=authentication" >> $GITHUB_OUTPUT
          elif [[ "$TARGET" == "skill" ]]; then
            echo "Deploying: Skill function only"
            echo "type=skill" >> $GITHUB_OUTPUT
          else
            echo "Deploying: Both functions"
            echo "type=both" >> $GITHUB_OUTPUT
          fi

      - name: SAM Build - Both Functions
        if: inputs.deployment_target == 'both'
        run: sam build

      - name: SAM Build - Authentication Function Only
        if: inputs.deployment_target == 'authentication'
        run: sam build GolfCanadaAuthenticationFunction

      - name: SAM Build - Skill Function Only
        if: inputs.deployment_target == 'skill'
        run: sam build GolfCanadaAlexaSkillFunction

      - name: Deploy to AWS
        run: |
          # Set DeployAuthentication based on target:
          # - 'skill' target: true (preserve the auth Lambda during normal skill updates)
          # - 'authentication' or 'both' targets: true
          DEPLOY_AUTH="true"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ secrets.STACK_NAME }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --region ${{ secrets.AWS_REGION }} \
            --parameter-overrides \
              ClientId="${{ secrets.GOLF_CANADA_CLIENT_ID }}" \
              ClientSecret="${{ secrets.GOLF_CANADA_CLIENT_SECRET }}" \
              SkillId="${{ secrets.ALEXA_SKILL_ID }}" \
              GolfCanadaUsername="${{ secrets.GOLF_CANADA_USERNAME }}" \
              GolfCanadaPassword="${{ secrets.GOLF_CANADA_PASSWORD }}" \
              DeployAuthentication="$DEPLOY_AUTH"

      - name: Update Alexa interaction model
        if: inputs.deployment_target != 'authentication'
        env:
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
          ALEXA_SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
        run: |
          ask smapi set-interaction-model \
            --profile __ENVIRONMENT_ASK_PROFILE__ \
            --skill-id "$ALEXA_SKILL_ID" \
            --stage development \
            --locale en-CA \
            --interaction-model file:./model/model.json
          echo "Alexa model update submitted; check the build status in the Alexa Developer Console."

      - name: Output deployment information
        run: |
          echo "✅ Deployment steps completed successfully!"
          echo "📦 Deployment target: ${{ inputs.deployment_target }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📚 Stack: ${{ secrets.STACK_NAME }}"
          echo "🌍 Region: ${{ secrets.AWS_REGION }}"
