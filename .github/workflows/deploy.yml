name: Deploy to AWS Lambda

on:
  push:
    tags:
      - 'v*'           # Triggers on any tag starting with 'v' (e.g., v1.0.0, v1.1.0)
      - 'auth-v*'      # Triggers on tags for authentication function only
      - 'skill-v*'     # Triggers on tags for skill function only

permissions:
  contents: read
  id-token: write    # Required for AWS OIDC authentication

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew packageJar

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Determine deployment target
        id: deployment-target
        run: |
          TAG="${{ github.ref_name }}"
          echo "Tag: $TAG"
          
          if [[ "$TAG" == auth-v* ]]; then
            echo "Deploying authentication function only"
            echo "deploy_auth=true" >> $GITHUB_OUTPUT
            echo "deploy_skill=false" >> $GITHUB_OUTPUT
            echo "deploy_both=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == skill-v* ]]; then
            echo "Deploying skill function only"
            echo "deploy_auth=false" >> $GITHUB_OUTPUT
            echo "deploy_skill=true" >> $GITHUB_OUTPUT
            echo "deploy_both=false" >> $GITHUB_OUTPUT
          else
            echo "Deploying both functions"
            echo "deploy_auth=false" >> $GITHUB_OUTPUT
            echo "deploy_skill=false" >> $GITHUB_OUTPUT
            echo "deploy_both=true" >> $GITHUB_OUTPUT
          fi

      - name: SAM Build
        run: sam build

      - name: Deploy both functions
        if: steps.deployment-target.outputs.deploy_both == 'true'
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ secrets.STACK_NAME }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --region ${{ secrets.AWS_REGION }} \
            --parameter-overrides \
              ClientId="${{ secrets.GOLF_CANADA_CLIENT_ID }}" \
              ClientSecret="${{ secrets.GOLF_CANADA_CLIENT_SECRET }}" \
              SkillId="${{ secrets.ALEXA_SKILL_ID }}"

      - name: Deploy authentication function only
        if: steps.deployment-target.outputs.deploy_auth == 'true'
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ secrets.STACK_NAME }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --region ${{ secrets.AWS_REGION }} \
            --parameter-overrides \
              ClientId="${{ secrets.GOLF_CANADA_CLIENT_ID }}" \
              ClientSecret="${{ secrets.GOLF_CANADA_CLIENT_SECRET }}" \
              SkillId="${{ secrets.ALEXA_SKILL_ID }}"

      - name: Deploy skill function only
        if: steps.deployment-target.outputs.deploy_skill == 'true'
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ secrets.STACK_NAME }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --region ${{ secrets.AWS_REGION }} \
            --parameter-overrides \
              ClientId="${{ secrets.GOLF_CANADA_CLIENT_ID }}" \
              ClientSecret="${{ secrets.GOLF_CANADA_CLIENT_SECRET }}" \
              SkillId="${{ secrets.ALEXA_SKILL_ID }}"

      - name: Output deployment information
        run: |
          echo "Deployment completed successfully!"
          echo "Tag: ${{ github.ref_name }}"
          echo "Stack: ${{ secrets.STACK_NAME }}"
          echo "Region: ${{ secrets.AWS_REGION }}"
