name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Choose the semantic version component to bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write  # Required to create releases

jobs:
  release:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Determine release version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          VERSION_COUNT=$(grep -c '^version=' gradle.properties || true)
          if [[ "$VERSION_COUNT" != "1" ]]; then
            echo "Error: gradle.properties must contain exactly one version property"
            exit 1
          fi

          GRADLE_VERSION=$(sed -n 's/^version=//p' gradle.properties)
          VERSION_PATTERN='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?-SNAPSHOT$'
          if [[ ! "$GRADLE_VERSION" =~ $VERSION_PATTERN ]]; then
            echo "Error: Gradle version must be MAJOR.MINOR.PATCH[-PRERELEASE]-SNAPSHOT"
            echo "Provided version: $GRADLE_VERSION"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          case "$RELEASE_TYPE" in
            patch)
              RELEASE_VERSION="${GRADLE_VERSION%-SNAPSHOT}"
              ;;
            minor)
              MINOR=$((10#$MINOR + 1))
              PATCH=0
              RELEASE_VERSION="$MAJOR.$MINOR.$PATCH"
              ;;
            major)
              MAJOR=$((10#$MAJOR + 1))
              MINOR=0
              PATCH=0
              RELEASE_VERSION="$MAJOR.$MINOR.$PATCH"
              ;;
            *)
              echo "Error: Unsupported release type '$RELEASE_TYPE'"
              exit 1
              ;;
          esac

          TAG="v$RELEASE_VERSION"
          NEXT_PATCH=$((10#$PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH-SNAPSHOT"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Creating release $TAG from branch $GITHUB_REF_NAME"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'alpha') || contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Gradle version
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          sed -i "s/^version=.*/version=$NEXT_VERSION/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Bump version to $NEXT_VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
